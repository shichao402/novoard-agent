<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novoard Agent</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e6e8ee; }
    main { width: 420px; max-width: 86vw; padding: 28px; border: 1px solid #2b3240; border-radius: 16px; background: #151922; text-align: center; }
    .mark { width: 58px; height: 58px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 15px; background: #2d6cb5; font-size: 28px; font-weight: 700; }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0; color: #8b93a7; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
    .pulse { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 50%; background: #4a90d9; animation: pulse 1.2s ease-in-out infinite; }
    .error .pulse { background: #ff5f57; animation: none; }
    @keyframes pulse { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <main id="card">
    <div class="mark">N</div>
    <h1>Novoard Agent</h1>
    <p><span class="pulse"></span><span id="status">正在启动本机 Agent 服务…</span></p>
  </main>
  <script>
    window.setHostStatus = function (message, isError) {
      document.getElementById("status").textContent = message;
      document.getElementById("card").classList.toggle("error", Boolean(isError));
    };
  </script>
</body>
</html>
