[package]
name = "novoard-agent-desktop"
version = "0.3.3"
description = "Novoard Agent desktop tray host"
authors = ["Novoard"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "novoard_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "novoard-agent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
log = "0.4"
# 由 scripts/stage-relkit.mjs 从 relkit 服务器取回并验签后物化，不进 git
relkit-updater = { path = "../../.relkit/sdk-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
