name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  contract-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Linux SEA
        run: npm run build
        env:
          NOVOARD_BUILD_PLATFORM: linux
          NOVOARD_BUILD_ARCH: x64
      - name: Smoke SEA host protocol
        run: npm run smoke:sidecar
        env:
          NOVOARD_BUILD_PLATFORM: linux
          NOVOARD_BUILD_ARCH: x64
