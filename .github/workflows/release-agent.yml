name: release-agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-13
            platform: darwin
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build SEA binary
        run: node scripts/build-agent.mjs
      - name: Package zip (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build/dist/${{ matrix.platform }}-${{ matrix.arch }}
          zip -r "../../../novoard-agent-${{ matrix.platform }}-${{ matrix.arch }}.zip" .
      - name: Package zip (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/dist/${{ matrix.platform }}-${{ matrix.arch }}/*" -DestinationPath "novoard-agent-${{ matrix.platform }}-${{ matrix.arch }}.zip" -Force
      - name: Upload artifact (workflow debug)
        uses: actions/upload-artifact@v4
        with:
          name: novoard-agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: novoard-agent-${{ matrix.platform }}-${{ matrix.arch }}.zip
      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: novoard-agent-${{ matrix.platform }}-${{ matrix.arch }}.zip
