name: release-agent

# 两条发布路径，共用同一套 relkit 产出：
#   push tag v<semver>     → stable 渠道（Release 档），并附 GitHub Release
#   workflow_dispatch      → dev 渠道（Dev 档），只发到 relkit
# 每个平台 job 只做到 ArtifactSet 为止，不持 token；publish job 汇总后 stage + release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NOVOARD_RELEASE_TAG: ${{ github.ref_name }}
  RELKIT_CHANNEL: ${{ github.event_name == 'push' && 'stable' || 'dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 与 ci.yml 同口径：发布前对齐当前 SSOT，而非固定历史提交（需求 6）。
      - name: Checkout Hub contract SSOT (current)
        uses: actions/checkout@v4
        with:
          repository: shichao402/Novoard
          ref: main
          path: .contract-ssot
          sparse-checkout: |
            docs/architecture/contracts.md
            docs/architecture/schemas
            src/frames.mjs
            src/contract/version.mjs
            conformance
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          NOVOARD_HUB_ROOT: .contract-ssot

  # 唯一领号处：releaseCode 由服务器分配（relkit ADR 0025），一次发布只领一次，矩阵共用。
  # x.y.z 取自 VERSION.json；stable 时 tag 必须等于 v<VERSION.json>，否则在领号前失败。
  plan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      code: ${{ steps.release.outputs.code }}
      channel: ${{ steps.release.outputs.channel }}
    env:
      RELKIT_CLI: ${{ github.workspace }}/.relkit/tools/relkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check stable tag against VERSION.json
        if: env.RELKIT_CHANNEL == 'stable'
        run: node -e 'import("./scripts/version.mjs").then((m) => m.assertTagMatches(process.env.NOVOARD_RELEASE_TAG, m.readVersion()))'
      - name: Fetch relkit CLI
        run: |
          python scripts/relkit_tool.py --component cli --platform linux-amd64 --out-name relkit
          chmod +x "$RELKIT_CLI"
      - id: release
        name: Claim release code
        run: |
          code="$("$RELKIT_CLI" release-code claim)"
          node scripts/relkit-version.mjs --channel "$RELKIT_CHANNEL" --code "$code"
        env:
          RELKIT_CUSTODY_MANIFEST: relkit.custody.json
          RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}

  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            rust-target: x86_64-pc-windows-msvc
            relkit-target: windows-amd64
            exe: .exe
            installer: "*-setup.exe"
          - os: macos-14
            platform: darwin
            arch: arm64
            rust-target: aarch64-apple-darwin
            relkit-target: darwin-arm64
            exe: ""
            installer: "*.dmg"
          - os: macos-15-intel
            platform: darwin
            arch: x64
            rust-target: x86_64-apple-darwin
            relkit-target: darwin-amd64
            exe: ""
            installer: "*.dmg"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
      RELKIT_CLI: ${{ github.workspace }}/.relkit/tools/relkit${{ matrix.exe }}
      RELKIT_OUT: .relkit/out/${{ matrix.relkit-target }}
    steps:
      # changelog 取自 git 历史，三个平台必须看到同一份完整历史才能 merge。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Fetch relkit CLI
        run: |
          python scripts/relkit_tool.py --component cli --platform ${{ matrix.relkit-target }} --out-name "relkit${{ matrix.exe }}"
          chmod +x "$RELKIT_CLI" || true
      - name: Build Runtime Bootstrap
        run: '"$RELKIT_CLI" bootstrap build --project relkit.project.json --out .relkit/runtime-bootstrap.json'
      - name: Fetch relkit updater + Rust SDK
        run: node scripts/stage-relkit.mjs ${{ matrix.rust-target }}
      - name: Produce ArtifactSet
        run: |
          rm -rf "$RELKIT_OUT"
          "$RELKIT_CLI" artifacts produce \
            --version "${{ needs.plan.outputs.version }}" \
            --channel "${{ needs.plan.outputs.channel }}" \
            --target ${{ matrix.relkit-target }} \
            --out-dir "$RELKIT_OUT" \
            --out "$RELKIT_OUT/artifact-set.json"
      - name: Smoke SEA host protocol
        run: npm run smoke:sidecar
        env:
          NOVOARD_BUILD_PLATFORM: ${{ matrix.platform }}
          NOVOARD_BUILD_ARCH: ${{ matrix.arch }}
      - name: Desktop unit tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.rust-target }}
      - uses: actions/upload-artifact@v4
        with:
          name: relkit-out-${{ matrix.relkit-target }}
          path: ${{ env.RELKIT_OUT }}
          if-no-files-found: error
      - name: Attach installer to GitHub Release
        if: env.RELKIT_CHANNEL == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELKIT_OUT }}/${{ matrix.installer }}

  # 唯一持 token 的 job：merge → stage → release 必须在同一工作区完成。
  publish:
    needs: [plan, desktop]
    runs-on: ubuntu-latest
    env:
      PYTHON: python
      RELKIT_CLI: ${{ github.workspace }}/.relkit/tools/relkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch relkit CLI
        run: |
          python scripts/relkit_tool.py --component cli --platform linux-amd64 --out-name relkit
          chmod +x "$RELKIT_CLI"
      - uses: actions/download-artifact@v4
        with:
          pattern: relkit-out-*
          path: .relkit/in
      - name: Merge ArtifactSets
        run: |
          rm -rf .relkit/merged
          "$RELKIT_CLI" artifacts merge \
            --in .relkit/in/relkit-out-windows-amd64/artifact-set.json \
            --in .relkit/in/relkit-out-darwin-arm64/artifact-set.json \
            --in .relkit/in/relkit-out-darwin-amd64/artifact-set.json \
            --out .relkit/merged/artifact-set.json
      - name: Stage
        run: '"$RELKIT_CLI" stage --artifact-set .relkit/merged/artifact-set.json'
      - name: Release plan
        run: '"$RELKIT_CLI" release --version "${{ needs.plan.outputs.version }}"'
      - name: Release
        run: '"$RELKIT_CLI" release --version "${{ needs.plan.outputs.version }}" --execute'
        env:
          RELKIT_RELEASE_VIA_CI: "1"
          RELKIT_CUSTODY_MANIFEST: relkit.custody.json
          RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}

  linux-headless:
    needs: plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 控制台页面要先构建，SEA 构建会把它放到二进制旁的 ui/，zip 才有 /setup 页面
      - run: npm ci --prefix desktop && npm --prefix desktop run build
      - run: npm run build
        env:
          NOVOARD_BUILD_PLATFORM: linux
          NOVOARD_BUILD_ARCH: x64
      - run: npm run smoke:sidecar
        env:
          NOVOARD_BUILD_PLATFORM: linux
          NOVOARD_BUILD_ARCH: x64
      - name: Package headless zip
        shell: bash
        run: |
          cd build/dist/linux-x64
          zip -r "../../../novoard-agent-linux-x64.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: novoard-agent-linux-x64
          path: novoard-agent-linux-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: novoard-agent-linux-x64.zip
