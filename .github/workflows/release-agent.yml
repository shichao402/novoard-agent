name: release-agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NOVOARD_RELEASE_TAG: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Hub contract SSOT
        uses: actions/checkout@v4
        with:
          repository: shichao402/Novoard
          ref: a2eea2d962e528230de6b8b524917f6601b1a8b8
          path: .contract-ssot
          sparse-checkout: |
            docs/architecture/contracts.md
            docs/architecture/schemas
            src/frames.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:sync-version
      - run: npm test
        env:
          NOVOARD_HUB_ROOT: .contract-ssot

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            rust-target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
          - os: macos-14
            platform: darwin
            arch: arm64
            rust-target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
          - os: macos-15-intel
            platform: darwin
            arch: x64
            rust-target: x86_64-apple-darwin
            bundle: dmg
            extension: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
      - run: npm run release:sync-version
      - name: Build SEA binary
        run: npm run build
        env:
          NOVOARD_BUILD_PLATFORM: ${{ matrix.platform }}
          NOVOARD_BUILD_ARCH: ${{ matrix.arch }}
      - name: Smoke SEA host protocol
        run: npm run smoke:sidecar
        env:
          NOVOARD_BUILD_PLATFORM: ${{ matrix.platform }}
          NOVOARD_BUILD_ARCH: ${{ matrix.arch }}
      - name: Stage SEA sidecar
        run: npm run desktop:stage
        env:
          NOVOARD_BUILD_PLATFORM: ${{ matrix.platform }}
          NOVOARD_BUILD_ARCH: ${{ matrix.arch }}
          TAURI_TARGET_TRIPLE: ${{ matrix.rust-target }}
      - name: Desktop unit tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.rust-target }}
      - name: Build desktop installer
        working-directory: desktop
        run: npx tauri build --ci --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundle }}
      - name: Upload artifact (workflow debug)
        uses: actions/upload-artifact@v4
        with:
          name: novoard-agent-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/src-tauri/target/**/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/**/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}

  linux-headless:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:sync-version
      - run: npm run build
        env:
          NOVOARD_BUILD_PLATFORM: linux
          NOVOARD_BUILD_ARCH: x64
      - run: npm run smoke:sidecar
        env:
          NOVOARD_BUILD_PLATFORM: linux
          NOVOARD_BUILD_ARCH: x64
      - name: Package headless zip
        shell: bash
        run: |
          cd build/dist/linux-x64
          zip -r "../../../novoard-agent-linux-x64.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: novoard-agent-linux-x64
          path: novoard-agent-linux-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: novoard-agent-linux-x64.zip
